    });
    neueFormFeld.addEventListener('input', () => {
      zeile.classList.toggle('formwechsel-aktiv', neueFormFeld.value.trim().length > 0);
    });

    const toggle2Btn = document.getElementById(`formwechsel2Toggle_${st.station}`);
    const neueForm2Feld = document.getElementById(`neueForm2_${st.station}`);
    toggle2Btn.addEventListener('click', () => {
      neueForm2Feld.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
      neueForm2Feld.focus();
    });

    // Kundenauftrag: sobald im "Kunde"-Feld (erster oder zweiter
    // Formwechsel) ein Name eingetragen/geaendert wird, das zugehoerige
    // "Neue Form"-Feld blau hervorheben - entspricht der blauen
    // Kennzeichnung, die dieselbe Form/Kunde-Kombination auch am
    // Haupt-PC in der Excel-Datei und im PDF-Belegungsplan bekommt.
    const kundeFeld = document.getElementById(`kunde_${st.station}`);
    kundeFeld.addEventListener('input', () => {
      neueFormFeld.classList.toggle('kundenauftrag', kundeFeld.value.trim().length > 0);
    });
    const kunde2Feld = document.getElementById(`kunde2_${st.station}`);
    kunde2Feld.addEventListener('input', () => {
      neueForm2Feld.classList.toggle('kundenauftrag', kunde2Feld.value.trim().length > 0);
    });

    // Die vorgedruckte, laufende Form hat kein eigenes Kunde-Feld -
    // stattdessen wird direkt der Formtext selbst auf das Muster
    // "Artikelnummer - Kunde" geprueft (falls der Mitarbeiter das Feld
    // manuell korrigiert und dabei einen Kundennamen ergaenzt/entfernt).
    const formFeld = document.getElementById(`form_${st.station}`);
    formFeld.addEventListener('input', () => {
      formFeld.classList.toggle('kundenauftrag', formFeld.value.includes(' - '));
    });

    // Vorschlagsliste fuer Formnummern (eigenes, performantes Dropdown
    // statt datalist - siehe aktiviereArtikelAutocomplete weiter oben).
    aktiviereArtikelAutocomplete(`neueForm_${st.station}`);
    aktiviereArtikelAutocomplete(`neueForm2_${st.station}`);

    // Ende/Ausschuss aktualisieren live die Kaestchen-Gesamtsumme
    document.getElementById(`ende_${st.station}`).addEventListener('input', aktualisiereGesamtKaestchen);
  });

  // Tab-/Enter-Reihenfolge festlegen: Ende -> Ausschuss -> naechste
  // Station Ende -> Ausschuss -> ... (Formwechsel-Felder werden dabei
  // uebersprungen, da sie nur bei Bedarf ausgefuellt werden). Sowohl die
  // Tab-Taste (per tabindex) als auch Enter springen in dieser
  // Reihenfolge. Beim letzten Ausschuss-Feld (Station 20) landet der
  // Fokus auf dem "Absenden"-Button.
  let tabindexZaehler = 1;
  aktuellerStand.forEach((st, index) => {
    const endeFeld = document.getElementById(`ende_${st.station}`);
    const ausschussFeld = document.getElementById(`ausschuss_${st.station}`);
    endeFeld.tabIndex = tabindexZaehler++;
    ausschussFeld.tabIndex = tabindexZaehler++;

    const springeZuNaechstemEnde = () => {
      const naechsteStation = aktuellerStand[index + 1];
      if (naechsteStation) {
        document.getElementById(`ende_${naechsteStation.station}`)?.focus();
      } else {
        document.getElementById('absendenBtn')?.focus();
      }
    };

    endeFeld.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      ausschussFeld.focus();
    });
    ausschussFeld.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      springeZuNaechstemEnde();
    });
  });

  // Nach dem Aufbau: Autosave-Wiederherstellung versuchen
  stelleAutosaveWiederHer();

  // Auf jede Eingabe hin automatisch zwischenspeichern - "change"
  // zusaetzlich zu "input", da Checkboxen (Haekchen-Spalte) auf manchen
  // Browsern kein "input"-Event zuverlaessig ausloesen.
  bereich.addEventListener('input', speichereAutosave);
  bereich.addEventListener('change', speichereAutosave);

  // WICHTIG: die "left"-Position der fixierten Station-Spalte (2. von
  // links) wird aus der TATSAECHLICH gerenderten Breite der davor
  // liegenden Haekchen-Spalte berechnet, statt einen festen Pixel-Wert
  // anzunehmen - ein geschaetzter Wert war leicht daneben (Padding/
  // Zellrahmen variieren je nach Bildschirm), wodurch sich beim
  // horizontalen Scrollen die Station-Spalte mit der Haekchen-Spalte
  // ueberlappen oder eine Luecke zeigen konnte ("verrutschen").
  aktualisiereStickyPositionen();
  window.addEventListener('resize', aktualisiereStickyPositionen);
}

function aktualisiereStickyPositionen() {
  const ersteZelle = document.querySelector('table.stationen-tabelle td.spalte-haekchen');
  if (!ersteZelle) return;
  const breite = ersteZelle.getBoundingClientRect().width;
  const style = document.getElementById('dynamischeStickyStyles') || (() => {
    const s = document.createElement('style');
    s.id = 'dynamischeStickyStyles';
    document.head.appendChild(s);
    return s;
  })();
  style.textContent = `
    table.stationen-tabelle th:nth-child(2), table.stationen-tabelle td:nth-child(2) {
      left: ${breite}px;
    }
  `;
}

// ------------------------------------------------------------------
// Autosave im lokalen Speicher DIESES Tablets - falls die Seite
// versehentlich neu geladen wird oder das Tablet kurz die Verbindung
// verliert, geht die bereits eingegebene Schicht nicht verloren.
// ------------------------------------------------------------------
function sammleFormularDaten() {
  return {
    schicht: gewaehlteSchicht,
    datum: document.getElementById('datumFeld').value,
    // Zeitstempel DIESES Eingabestands selbst - wird beim
    // Wiederherstellen genutzt, um lokalen (localStorage) und Cloud-
    // Entwurf zu vergleichen und IMMER den neueren der beiden zu nehmen,
    // statt blind den lokalen zu bevorzugen (der z.B. veraltet sein
    // kann, wenn er vor einem Absturz nicht mehr aktualisiert wurde).
    gespeichertAm: new Date().toISOString(),
    // Zeitstempel der Vorlage, die zum Zeitpunkt dieser Eingabe geladen
    // war - wird beim Wiederherstellen genutzt, um zu erkennen, ob
    // inzwischen eine NEUERE Vorlage vom Haupt-PC eingetroffen ist (dann
    // duerfen die "Form"-Felder NICHT mit dem alten Autosave-Stand
    // ueberschrieben werden, siehe stelleAutosaveWiederHer()).
    vorlageZeitstempel: aktuelleVorlageZeitstempel,
    maschinenfuehrer: document.getElementById('maschinenfuehrerFeld').value,
    reinklopfer: document.getElementById('reinklopferFeld').value,
    rausnehmer: document.getElementById('rausnehmerFeld').value,
    stoerung: document.getElementById('stoerungFeld').value,
    stationen: aktuellerStand.map(st => ({
      station: st.station,
      haekchen: document.getElementById(`haekchen_${st.station}`)?.checked || false,
      form: document.getElementById(`form_${st.station}`)?.value || '',
      groesse: document.getElementById(`groesse_${st.station}`)?.value || '',
      soll: document.getElementById(`soll_${st.station}`)?.value || '',
      ende: document.getElementById(`ende_${st.station}`)?.value || '',
      ausschuss: document.getElementById(`ausschuss_${st.station}`)?.value || '',
      neueForm: document.getElementById(`neueForm_${st.station}`)?.value || '',
      neueGr: document.getElementById(`neueGr_${st.station}`)?.value || '',
      neuesSoll: document.getElementById(`neuesSoll_${st.station}`)?.value || '',
      neuesPaar: document.getElementById(`neuesPaar_${st.station}`)?.value || '',
      neuerAusschuss: document.getElementById(`neuerAusschuss_${st.station}`)?.value || '',
      kunde: document.getElementById(`kunde_${st.station}`)?.value || '',
      neueForm2: document.getElementById(`neueForm2_${st.station}`)?.value || '',
      neueGr2: document.getElementById(`neueGr2_${st.station}`)?.value || '',
      neuesSoll2: document.getElementById(`neuesSoll2_${st.station}`)?.value || '',
      neuesPaar2: document.getElementById(`neuesPaar2_${st.station}`)?.value || '',
      neuerAusschuss2: document.getElementById(`neuerAusschuss2_${st.station}`)?.value || '',
      kunde2: document.getElementById(`kunde2_${st.station}`)?.value || '',
    })),
  };
}

// Berechnet live die Gesamt-Kaestchen-Zahl (analog zur Haupt-App): pro
// Station "Ende minus Anfang", zusaetzlich die bereits produzierten
// Paar-Mengen bei Formwechsel(n) - ein Formwechsel bedeutet, dass die
// alte Form bis zum Wechsel lief und danach die neue Form weiterzaehlt,
// daher wird deren "Paar"-Wert einfach addiert (er ist bereits die
// eigenstaendig gezaehlte Menge der neuen Form).
function aktualisiereGesamtKaestchen() {
  let summe = 0;
  aktuellerStand.forEach(st => {
    const anfang = st.anfang || 0;
    const ende = parseFloat(document.getElementById(`ende_${st.station}`)?.value) || 0;
    const neuesPaar = parseFloat(document.getElementById(`neuesPaar_${st.station}`)?.value) || 0;
    const neuesPaar2 = parseFloat(document.getElementById(`neuesPaar2_${st.station}`)?.value) || 0;
    if (ende > 0) {
      summe += Math.max(0, ende - anfang) + neuesPaar + neuesPaar2;
    }
  });
  const anzeige = document.getElementById('gesamtKaestchenWert');
  if (anzeige) anzeige.textContent = summe;
}

function speichereAutosave() {
  clearTimeout(autosaveTimeout);
  autosaveTimeout = setTimeout(() => {
    speichereAutosaveSofort();
  }, 50);

  // Zusaetzlich zur schnellen lokalen Sicherung (localStorage) wird der
  // Zwischenstand auch in Supabase als "Entwurf" gesichert - das ist die
  // eigentlich robuste Absicherung: localStorage ist NUR auf diesem
  // einen Geraet vorhanden und kann durch Cache-Loeschung, App-Neustart
  // durch das Betriebssystem oder einen Geraete-Reset komplett verloren
  // gehen. Bewusst NUR noch minimal gedrosselt (300ms statt vorher
  // 1000ms/2500ms), damit praktisch JEDE Eingabe so gut wie sofort in
  // der Cloud gesichert ist - Datenverlust hat hoechste Prioritaet vor
  // dem (geringen) Mehraufwand an Netzwerkanfragen.
  clearTimeout(cloudAutosaveTimeout);
  cloudAutosaveTimeout = setTimeout(() => {
    speichereCloudEntwurf();
  }, 300);
}

// Speichert SOFORT, ohne Verzoegerung - wird zusaetzlich zur
// verzoegerten speichereAutosave() beim Verlassen/Minimieren der
// Seite aufgerufen (siehe visibilitychange/pagehide weiter unten), damit
// eine Eingabe, die kurz vor dem Wechseln zur naechsten Station oder
// Schliessen der App gemacht wurde, garantiert nicht durch das 400ms-
// Verzoegerungsfenster verloren geht.
function speichereAutosaveSofort() {
  try {
    localStorage.setItem(AUTOSAVE_SCHLUESSEL, JSON.stringify(sammleFormularDaten()));
  } catch (e) { /* unkritisch, Autosave ist nur Komfort */ }
}

// Speichert den aktuellen Zwischenstand als "Entwurf" in Supabase - der
// Haupt-PC sieht diese Schichten NICHT (der Filter fuer "Vom Tablet
// gesendet" bleibt auf status='offen'), das dient ausschliesslich als
// Wiederherstellungs-Sicherung fuer DIESES Tablet, falls sein lokaler
// Speicher (localStorage) verloren geht.
// Oeffentliche Funktion: reiht den eigentlichen Speichervorgang in die
// Kette ein, statt ihn sofort parallel zu starten - garantiert, dass
// niemals zwei Aufrufe gleichzeitig laufen (siehe Kommentar bei
// cloudEntwurfKette weiter oben).
function speichereCloudEntwurf() {
  cloudEntwurfKette = cloudEntwurfKette.then(() => speichereCloudEntwurfInnen());
  return cloudEntwurfKette;
}

async function speichereCloudEntwurfInnen() {
  if (!gewaehlteSchicht) return;
  const heuteIso = ausgewaehltesDatumIso();
  // WICHTIG: falls genau diese Schicht/Datum-Kombination gerade schon
  // erfolgreich final abgesendet wurde (moeglich, wenn dieser Aufruf
  // bereits "unterwegs" war, als der Absenden-Klick durchlief), NICHTS
  // mehr schreiben - sonst wuerde die frisch gesendete status='offen'-
  // Zeile hier faelschlich wieder auf status='entwurf' mit
  // zwischenzeitlich bereits geleerten Nullwerten zurueckgesetzt.
  if (bereitsAbgesendeteKombinationen.has(`${gewaehlteSchicht}|${heuteIso}`)) return;
  try {
    const formular = sammleFormularDaten();
    const stationenFuerDatenbank = aktuellerStand.map(st => {
      const eingabe = formular.stationen.find(f => f.station === st.station) || {};
      return {
        station: st.station,
        ende: parseFloat(eingabe.ende) || 0,
        ausschuss: parseFloat(eingabe.ausschuss) || 0,
        neue_form: (eingabe.neueForm || '').trim(),
        neue_gr: (eingabe.neueGr || '').trim(),
        neues_soll: (eingabe.neuesSoll || '').trim(),
        neues_paar: parseFloat(eingabe.neuesPaar) || 0,
        neuer_ausschuss: parseFloat(eingabe.neuerAusschuss) || 0,
        kunde: (eingabe.kunde || '').trim(),
        korrektur_form: (eingabe.form || '').trim(),
        korrektur_gr: (eingabe.groesse || '').trim(),
        korrektur_soll: (eingabe.soll || '').trim(),
        korrektur_anfang: String(st.anfang),
      };
    });

    const formwechselMitWert = stationenFuerDatenbank.filter(st => st.neue_form);
    diagnose(`speichereCloudEntwurf(): sende ${formwechselMitWert.length} Formwechsel-Eintraege: ${JSON.stringify(formwechselMitWert.map(s => ({station: s.station, form: s.neue_form})))}`);

    // ZUSAETZLICHE, datenbankseitige Absicherung (unabhaengig vom
    // lokalen JavaScript-Timing): direkt vor dem Schreiben nochmal
    // pruefen, ob die Zeile in der Datenbank inzwischen einen ANDEREN
    // Status als 'entwurf' hat (also bereits final 'offen' oder
    // 'abgeschlossen' ist) - falls ja, NICHT schreiben. Das faengt auch
    // den Fall ab, dass diese Funktion bereits laeuft, waehrend
    // "Schicht absenden" parallel fertig wird.
    const { data: bestehendeZeile } = await supabaseClient
      .from('schichten')
      .select('status, stationen')
      .eq('rundlaeufer', RUNDLAEUFER_NUMMER)
      .eq('datum', heuteIso)
      .eq('schicht', gewaehlteSchicht)
      .maybeSingle();
    if (bestehendeZeile && bestehendeZeile.status !== 'entwurf') {
      bereitsAbgesendeteKombinationen.add(`${gewaehlteSchicht}|${heuteIso}`);
      return;
    }

    // KRITISCHE ABSICHERUNG gegen versehentliches "Leerschreiben": wenn
    // in der Datenbank bereits ein NICHT-leerer Entwurf existiert (also
    // mindestens eine Station hat einen Ende-Wert oder Formwechsel),
    // der neu zu schreibende Stand aber KOMPLETT LEER waere, wird NICHT
    // gespeichert. Ein komplett leerer Stand kann durch verschiedene
    // seltene Ablaufprobleme entstehen (z.B. wenn die Tabelle im
    // Formular gerade neu aufgebaut wird, waehrend "Aktualisieren"
    // geklickt wird) - in jedem Fall soll ein bereits vorhandener,
    // echter Zwischenstand niemals durch einen leeren Stand ersetzt
    // werden, das waere immer ein Datenverlust, nie ein gewolltes
    // Verhalten.
    const neuerStandIstLeer = stationenFuerDatenbank.every(st =>
      !st.ende && !st.ausschuss && !st.neue_form && !st.neuer_ausschuss
    );
    const bestehenderStandIstNichtLeer = bestehendeZeile && (bestehendeZeile.stationen || []).some(st =>
      st.ende || st.ausschuss || st.neue_form || st.neuer_ausschuss
    );
    if (neuerStandIstLeer && bestehenderStandIstNichtLeer) {
      console.warn('[Diagnose] Cloud-Entwurf-Speicherung ABGEBROCHEN: der neue Stand ist komplett leer, waehrend in der Datenbank bereits ein nicht-leerer Stand existiert - ein Ueberschreiben mit leeren Werten wird verhindert.');
      return;
    }

    await supabaseClient
      .from('schichten')
      .upsert({
        rundlaeufer: RUNDLAEUFER_NUMMER,
        datum: heuteIso,
        schicht: gewaehlteSchicht,
        maschinenfuehrer: formular.maschinenfuehrer,
        reinklopfer: formular.reinklopfer,
        rausnehmer: formular.rausnehmer,
        stoerungsvermerk: formular.stoerung,
        stationen: stationenFuerDatenbank,
        status: 'entwurf',
        quelle: 'tablet',
        aktualisiert_am: new Date().toISOString(),
      }, { onConflict: 'rundlaeufer,datum,schicht' });
    // Fehler hier bewusst nicht dem Nutzer anzeigen - die lokale
    // Sicherung (localStorage) greift ohnehin zusaetzlich, ein
    // fehlgeschlagener Cloud-Entwurf (z.B. wegen kurzzeitig fehlendem
    // WLAN) soll die Eingabe nicht stoeren.
  } catch (fehler) {
    console.warn('Cloud-Entwurf konnte nicht gespeichert werden (unkritisch, lokale Sicherung greift weiterhin):', fehler);
  }
}

// WICHTIG: sobald die Seite in den Hintergrund wechselt (App gewechselt,
// Bildschirm gesperrt, Tablet-Ueberblick geoeffnet) oder komplett
// geschlossen wird, wird SOFORT (ohne das 400ms-Verzoegerungsfenster von
// speichereAutosave) gespeichert. "visibilitychange" deckt das Wechseln
// in den Hintergrund ab (zuverlaessiger als "pagehide" auf vielen
// Android-Browsern), "pagehide" zusaetzlich das tatsaechliche Schliessen.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') {
    clearTimeout(autosaveTimeout);
    clearTimeout(cloudAutosaveTimeout);
    speichereAutosaveSofort();
    speichereCloudEntwurf();
  }
});
window.addEventListener('pagehide', () => {
  clearTimeout(autosaveTimeout);
  clearTimeout(cloudAutosaveTimeout);
  speichereAutosaveSofort();
  speichereCloudEntwurf();
});

async function stelleAutosaveWiederHer() {
  // WICHTIG: BEIDE Quellen (lokal UND Cloud) werden immer geladen und
  // anhand ihres Zeitstempels ("gespeichertAm") verglichen - der NEUERE
  // Stand gewinnt. Fruehere Version pruefte die Cloud nur, wenn der
  // lokale Speicher komplett LEER war - das fuehrte dazu, dass ein
  // veralteter lokaler Stand (z.B. weil er vor einem Absturz/Neuladen
  // nicht mehr aktualisiert wurde) faelschlich einen viel aktuelleren
  // Cloud-Stand verdeckte, obwohl in der Cloud bereits mehr Stationen
  // korrekt eingetragen waren.
  const roh = localStorage.getItem(AUTOSAVE_SCHLUESSEL);
  let datenLokal = null;
  if (roh) {
    try { datenLokal = JSON.parse(roh); } catch (e) { console.error('Lokaler Autosave beschädigt:', e); }
  }
  const datenCloud = await ladeCloudEntwurfFallsVorhanden();

  const zaehleAusgefuellt = (d) => d ? (d.stationen || []).filter(st => st.ende || st.ausschuss || st.neueForm).length : -1;
  const anzahlLokal = zaehleAusgefuellt(datenLokal);
  const anzahlCloud = zaehleAusgefuellt(datenCloud);
  diagnose(`Wiederherstellung: lokal=${!!datenLokal}(${anzahlLokal} Stat.) cloud=${!!datenCloud}(${anzahlCloud} Stat.)`);

  let daten = null;
  let quelleCloud = false;
  if (datenLokal && datenCloud) {
    // WICHTIG: der Zeitstempel-Vergleich allein reicht NICHT aus - ein
    // leerer Stand (z.B. weil localStorage GERADE EBEN durch einen
    // frischen, aber leeren speichereAutosaveSofort()-Aufruf einen neuen
    // Zeitstempel bekommen hat) darf NIEMALS einen nicht-leeren Stand
    // verdraengen, selbst wenn er zeitlich "neuer" ist. Nur wenn BEIDE
    // Seiten eine aehnliche Datenmenge haben (oder beide leer sind),
    // entscheidet der Zeitstempel wie bisher.
    if (anzahlCloud > 0 && anzahlLokal === 0) {
      daten = datenCloud;
      quelleCloud = true;
      diagnose('-> Lokaler Stand ist LEER, Cloud hat Daten - Cloud wird bevorzugt (unabhaengig vom Zeitstempel).');
    } else if (anzahlLokal > 0 && anzahlCloud === 0) {
      daten = datenLokal;
      diagnose('-> Cloud-Stand ist LEER, lokal hat Daten - lokal wird bevorzugt (unabhaengig vom Zeitstempel).');
    } else {
      const lokalZeit = datenLokal.gespeichertAm ? new Date(datenLokal.gespeichertAm) : new Date(0);
      const cloudZeit = datenCloud.gespeichertAm ? new Date(datenCloud.gespeichertAm) : new Date(0);
      if (cloudZeit > lokalZeit) {
        daten = datenCloud;
        quelleCloud = true;
        diagnose('-> Cloud-Entwurf ist NEUER, wird verwendet.');
      } else {
        daten = datenLokal;
        diagnose('-> Lokaler Autosave ist neuer/gleich, wird verwendet.');
      }
    }
  } else if (datenCloud) {
    daten = datenCloud;
    quelleCloud = true;
    diagnose('-> Nur Cloud-Entwurf vorhanden, wird verwendet.');
  } else if (datenLokal) {
    daten = datenLokal;
    diagnose('-> Nur lokaler Autosave vorhanden, wird verwendet.');
  } else {
    diagnose('-> WEDER lokal noch Cloud gefunden - keine Wiederherstellung.');
  }

  if (!daten) return;

  try {
    // WICHTIG: allein die automatische Schicht-Vorauswahl beim Laden
    // (siehe waehleSchicht() weiter oben) loest bereits ein
    // speichereAutosave() aus - das erzeugt einen Eintrag, der nur
    // "Schicht: Früh/Spät" enthaelt, aber sonst komplett leer ist. Das
    // ist KEIN "unvollstaendig gesendeter Stand", sondern voellig normal
    // bei jedem frischen Laden. Nur wenn WIRKLICH mindestens ein Feld
    // (Team, Stoerung, eine Station, ODER ein bewusst von "heute"
    // abweichendes Datum fuer eine nachtraeglich einzutragende Schicht)
    // ausgefuellt/geaendert ist, handelt es sich um einen echten,
    // wiederherstellenswerten Zwischenstand.
    const teamAusgefuellt = !!(daten.maschinenfuehrer || daten.reinklopfer || daten.rausnehmer || daten.stoerung);
    const stationAusgefuellt = (daten.stationen || []).some(st =>
      st.haekchen || st.ende || st.ausschuss || st.neueForm || st.neueGr || st.neuesSoll || st.neuesPaar ||
      st.neuerAusschuss || st.kunde || st.neueForm2 || st.neueGr2 || st.neuesSoll2 ||
      st.neuesPaar2 || st.neuerAusschuss2 || st.kunde2
    );
    const datumGeaendert = !!(daten.datum && daten.datum !== lokalesDatumIso());
    const istEchterZwischenstand = teamAusgefuellt || stationAusgefuellt || datumGeaendert;

    // KRITISCH: falls die Vorlage, mit der der Autosave gespeichert
    // wurde, AELTER ist als die gerade frisch geladene Vorlage (der
    // Haupt-PC hat also inzwischen einen neuen Belegungsplan erstellt),
    // duerfen die "Form"/"Größe"/"Soll"-Felder (vorgedruckte, aktuelle
    // Werte) NICHT aus dem alten Autosave ueberschrieben werden - sonst
    // wuerden frisch geladene, korrekte neue Formnummern durch die alten
    // ueberschrieben. Die tatsaechlichen EINGABEN des Mitarbeiters
    // (Ende, Ausschuss, Formwechsel...) werden trotzdem wiederhergestellt,
    // da diese unabhaengig von der Vorlage sind und sonst verloren gingen.
    // Vergleich der Vorlagen-Zeitstempel: nur wenn beide bekannt sind
    // UND die aktuell geladene Vorlage NACHWEISLICH neuer ist, werden
    // die Form/Gr./Soll-Felder NICHT aus dem Autosave uebernommen (das
    // Formular verwendet dann stattdessen die frisch geladenen, neuen
    // Werte). Ist einer der beiden Zeitstempel unbekannt (z.B. ein sehr
    // alter Autosave-Eintrag von vor dieser Funktion), wird der
    // Autosave-Stand normal wiederhergestellt wie bisher - fuer
    // korrekte Funktion in diesem Fall muss auf jedem Tablet EINMALIG
    // der Browser-Cache/die App-Daten geleert werden, damit kein
    // Autosave-Eintrag ohne diesen Zeitstempel mehr vorhanden ist.
    const vorlageIstNeuer = !!aktuelleVorlageZeitstempel && !!daten.vorlageZeitstempel &&
      new Date(aktuelleVorlageZeitstempel) > new Date(daten.vorlageZeitstempel);
    if (vorlageIstNeuer) {
      console.warn('[Diagnose] Autosave stammt von einer AELTEREN Vorlage - Form/Gr./Soll-Felder werden NICHT ueberschrieben, nur die Eingaben (Ende, Ausschuss, Formwechsel) werden wiederhergestellt.');
    }

    if (daten.schicht) waehleSchicht(daten.schicht);
    if (daten.datum) document.getElementById('datumFeld').value = daten.datum;
    document.getElementById('maschinenfuehrerFeld').value = daten.maschinenfuehrer || '';
    document.getElementById('reinklopferFeld').value = daten.reinklopfer || '';
    document.getElementById('rausnehmerFeld').value = daten.rausnehmer || '';
    document.getElementById('stoerungFeld').value = daten.stoerung || '';
    (daten.stationen || []).forEach(st => {
      const setzeWert = (id, wert) => { const el = document.getElementById(id); if (el && wert) el.value = wert; };
      const haekchenFeld = document.getElementById(`haekchen_${st.station}`);
      if (haekchenFeld) haekchenFeld.checked = !!st.haekchen;
      if (!vorlageIstNeuer) {
        setzeWert(`form_${st.station}`, st.form);
        setzeWert(`groesse_${st.station}`, st.groesse);
        setzeWert(`soll_${st.station}`, st.soll);
      }
      setzeWert(`ende_${st.station}`, st.ende);
      setzeWert(`ausschuss_${st.station}`, st.ausschuss);
      setzeWert(`neueForm_${st.station}`, st.neueForm);
      setzeWert(`neueGr_${st.station}`, st.neueGr);
      setzeWert(`neuesSoll_${st.station}`, st.neuesSoll);
      setzeWert(`neuesPaar_${st.station}`, st.neuesPaar);
      setzeWert(`neuerAusschuss_${st.station}`, st.neuerAusschuss);
      setzeWert(`kunde_${st.station}`, st.kunde);
      setzeWert(`neueForm2_${st.station}`, st.neueForm2);
      setzeWert(`neueGr2_${st.station}`, st.neueGr2);
      setzeWert(`neuesSoll2_${st.station}`, st.neuesSoll2);
      setzeWert(`neuesPaar2_${st.station}`, st.neuesPaar2);
      setzeWert(`neuerAusschuss2_${st.station}`, st.neuerAusschuss2);
      setzeWert(`kunde2_${st.station}`, st.kunde2);
      document.getElementById(`neueForm_${st.station}`)?.classList.toggle('kundenauftrag', !!(st.kunde || '').trim());
      document.getElementById(`neueForm2_${st.station}`)?.classList.toggle('kundenauftrag', !!(st.kunde2 || '').trim());
      document.getElementById(`form_${st.station}`)?.classList.toggle('kundenauftrag', (st.form || '').includes(' - '));
      if (st.neueForm) {
        document.getElementById(`stationZeile${st.station}`)?.classList.add('formwechsel-aktiv');
      }
    });
    aktualisiereGesamtKaestchen();

    // Zaehlt NACH der Wiederherstellung direkt im DOM nach, wie viele
    // Stationen tatsaechlich einen Ende-Wert haben - zeigt zuverlaessig,
    // ob das Wiederherstellen wirklich gegriffen hat, unabhaengig davon,
    // was "daten" behauptet.
    const tatsaechlichImDom = aktuellerStand.filter(st => {
      const feld = document.getElementById(`ende_${st.station}`);
      return feld && feld.value;
    }).length;
    diagnose(`Wiederherstellung angewendet, istEchterZwischenstand=${istEchterZwischenstand}, vorlageIstNeuer=${vorlageIstNeuer}, quelleCloud=${quelleCloud}, TATSAECHLICH im DOM ausgefuellte Stationen NACHHER=${tatsaechlichImDom}`);

    if (istEchterZwischenstand) {
      document.getElementById('autosaveHinweisBtn').style.display = 'block';
      let meldungText;
      if (vorlageIstNeuer) {
        meldungText = 'ℹ️ Deine bisherigen Eingaben (Ende, Ausschuss, Formwechsel) wurden wiederhergestellt. WICHTIG: Es liegt inzwischen ein NEUER Belegungsplan vor - die vorgedruckten Form/Gr./Soll-Werte zeigen bereits den aktuellen Stand, bitte NICHT mehr manuell anpassen.';
      } else if (quelleCloud) {
        meldungText = 'ℹ️ Ein zuvor unvollständig gesendeter Stand wurde aus der Cloud-Sicherung wiederhergestellt (lokaler Speicher war leer).';
      } else {
        meldungText = 'ℹ️ Ein zuvor unvollständig gesendeter Stand wurde wiederhergestellt.';
      }
      zeigeMeldung('info', meldungText);
      // Automatisch nach kurzer Zeit ausblenden, statt dass der
      // Hinweis-Button dauerhaft stehen bleibt und manuell weggetippt
      // werden muss - der Zwischenstand selbst ist ja bereits sichtbar
      // im Formular eingetragen, der Hinweis dient nur der kurzen
      // Information direkt nach dem Laden.
      setTimeout(() => {
        document.getElementById('autosaveHinweisBtn').style.display = 'none';
      }, 8000);
      // Den wiederhergestellten Stand direkt auch wieder lokal sichern,
      // damit er ab jetzt schnell verfuegbar ist.
      speichereAutosaveSofort();
    }
  } catch (e) { console.error('Autosave konnte nicht wiederhergestellt werden:', e); }
}

// Sucht in Supabase nach einem "Entwurf" fuer diesen Rundlaeufer und
// den heutigen Tag (beide Schichten werden geprueft, da nicht
// zwingend bekannt ist, welche Schicht der Mitarbeiter zuletzt
// bearbeitet hatte) und wandelt ihn in dasselbe Format um, das auch
// der lokale Autosave nutzt.
async function ladeCloudEntwurfFallsVorhanden() {
  try {
    // WICHTIG: sucht NICHT nur nach dem heutigen Datum, sondern nach dem
    // zuletzt aktualisierten offenen Entwurf fuer diesen Rundlaeufer -
    // sonst wuerde ein Entwurf fuer ein bewusst geaendertes Datum (z.B.
    // eine nachtraeglich einzutragende Schicht von gestern) hier nicht
    // gefunden werden.
    const { data, error } = await supabaseClient
      .from('schichten')
      .select('*')
      .eq('rundlaeufer', RUNDLAEUFER_NUMMER)
      .eq('status', 'entwurf')
      .order('aktualisiert_am', { ascending: false })
      .limit(1)
      .maybeSingle();

    if (error || !data) return null;

    return {
      schicht: data.schicht,
      datum: data.datum,
      gespeichertAm: data.aktualisiert_am,
      maschinenfuehrer: data.maschinenfuehrer,
      reinklopfer: data.reinklopfer,
      rausnehmer: data.rausnehmer,
      stoerung: data.stoerungsvermerk,
      stationen: (data.stationen || []).map(st => ({
        station: st.station,
        form: st.korrektur_form,
        groesse: st.korrektur_gr,
        soll: st.korrektur_soll,
        ende: st.ende ? String(st.ende) : '',
        ausschuss: st.ausschuss ? String(st.ausschuss) : '',
        neueForm: st.neue_form,
        neueGr: st.neue_gr,
        neuesSoll: st.neues_soll,
        neuesPaar: st.neues_paar ? String(st.neues_paar) : '',
        neuerAusschuss: st.neuer_ausschuss ? String(st.neuer_ausschuss) : '',
        kunde: st.kunde,
      })),
    };
  } catch (fehler) {
    console.warn('Cloud-Entwurf konnte nicht abgerufen werden:', fehler);
    return null;
  }
}

function loescheAutosave() {
  localStorage.removeItem(AUTOSAVE_SCHLUESSEL);
}

// ------------------------------------------------------------------
// Absenden: Schicht in die Datenbank schreiben (Tabelle "schichten"),
// analog zum Format, das die Haupt-App auch fuer die KI-Auswertung
// nutzt - damit "Belegungsplan erstellen" am Haupt-PC diese Daten
// genauso verarbeiten kann wie einen gescannten Zettel.
// ------------------------------------------------------------------
// ------------------------------------------------------------------
// "Rückgängig"-Funktion: erscheint kurz nach erfolgreichem Absenden,
// damit ein versehentliches Absenden (bevor alles korrekt eingetragen
// war) rueckgaengig gemacht werden kann. Stellt das Formular 1:1 wieder
// her und loescht den gerade erst gesendeten Datenbank-Eintrag wieder,
// damit die Schicht erneut bearbeitet und gesendet werden kann.
let rueckgaengigTimeout = null;
function zeigeRueckgaengigButton() {
  const btn = document.getElementById('rueckgaengigBtn');
  btn.style.display = 'block';
  if (rueckgaengigTimeout) clearTimeout(rueckgaengigTimeout);
  // Nach 30 Sekunden automatisch wieder ausblenden - danach gilt die
  // Schicht als endgueltig gesendet.
  rueckgaengigTimeout = setTimeout(() => {
    btn.style.display = 'none';
    letzterGesendeterStand = null;
  }, 30000);
}

document.getElementById('rueckgaengigBtn').addEventListener('click', async () => {
  if (!letzterGesendeterStand) return;
  const btn = document.getElementById('rueckgaengigBtn');
  btn.disabled = true;
  btn.textContent = 'Wird rückgängig gemacht...';

  try {
    // Den gerade gesendeten Datenbank-Eintrag wieder loeschen, damit er
    // nicht faelschlich am Haupt-PC als "vom Tablet gesendet" auftaucht,
    // waehrend hier noch weiter korrigiert wird.
    if (letzterGesendeterStand.schichtId) {
      const { error } = await supabaseClient.from('schichten').delete().eq('id', letzterGesendeterStand.schichtId);
      if (error) throw error;
    }

    // Formular-Werte 1:1 wiederherstellen (Team, Störung, alle Stationen).
    const formular = letzterGesendeterStand.formular;
    waehleSchicht(letzterGesendeterStand.schicht);
    document.getElementById('maschinenfuehrerFeld').value = formular.maschinenfuehrer || '';
    document.getElementById('reinklopferFeld').value = formular.reinklopfer || '';
    document.getElementById('rausnehmerFeld').value = formular.rausnehmer || '';
    document.getElementById('stoerungFeld').value = formular.stoerung || '';
    (formular.stationen || []).forEach(st => {
      const setzeWert = (id, wert) => { const el = document.getElementById(id); if (el) el.value = wert || ''; };
      const haekchenFeld = document.getElementById(`haekchen_${st.station}`);
      if (haekchenFeld) haekchenFeld.checked = !!st.haekchen;
      setzeWert(`ende_${st.station}`, st.ende);
      setzeWert(`ausschuss_${st.station}`, st.ausschuss);
      setzeWert(`neueForm_${st.station}`, st.neueForm);
      setzeWert(`neueGr_${st.station}`, st.neueGr);
      setzeWert(`neuesSoll_${st.station}`, st.neuesSoll);
      setzeWert(`neuesPaar_${st.station}`, st.neuesPaar);
      setzeWert(`neuerAusschuss_${st.station}`, st.neuerAusschuss);
      setzeWert(`kunde_${st.station}`, st.kunde);
      setzeWert(`neueForm2_${st.station}`, st.neueForm2);
      setzeWert(`neueGr2_${st.station}`, st.neueGr2);
      setzeWert(`neuesSoll2_${st.station}`, st.neuesSoll2);
      setzeWert(`neuesPaar2_${st.station}`, st.neuesPaar2);
      setzeWert(`neuerAusschuss2_${st.station}`, st.neuerAusschuss2);
      setzeWert(`kunde2_${st.station}`, st.kunde2);
      document.getElementById(`neueForm_${st.station}`)?.classList.toggle('kundenauftrag', !!(st.kunde || '').trim());
      document.getElementById(`neueForm2_${st.station}`)?.classList.toggle('kundenauftrag', !!(st.kunde2 || '').trim());
      // Das "alte" Form-Feld wird von "Rueckgaengig" nicht ueberschrieben
      // (es bleibt unveraendert stehen) - daher wird hier direkt der
      // AKTUELL im Feld stehende Wert geprueft, nicht st.form.
      const formFeldRueckgaengig = document.getElementById(`form_${st.station}`);
      if (formFeldRueckgaengig) formFeldRueckgaengig.classList.toggle('kundenauftrag', formFeldRueckgaengig.value.includes(' - '));
      const formGeaendert = (st.form || '').trim().length > 0;
      const zeile = document.getElementById(`stationZeile${st.station}`);
      if ((st.neueForm || '').trim() && zeile) zeile.classList.add('formwechsel-aktiv');
    });
    aktualisiereGesamtKaestchen();
    speichereAutosave();

    if (rueckgaengigTimeout) clearTimeout(rueckgaengigTimeout);
    btn.style.display = 'none';
    letzterGesendeterStand = null;
    zeigeMeldung('info', 'ℹ️ Zuletzt gesendete Schicht wurde rückgängig gemacht - bitte korrigieren und erneut absenden.');
  } catch (fehler) {
    console.error('Rückgängig machen fehlgeschlagen:', fehler);
    zeigeMeldung('fehler', '❌ Rückgängig machen fehlgeschlagen: ' + fehler.message);
  } finally {
    btn.disabled = false;
    btn.textContent = '↩️ Zuletzt gesendete Schicht rückgängig machen';
  }
});

let sendeVorgangLaeuft = false;
// Merkt sich "schicht|datum"-Kombinationen, die bereits erfolgreich final
// abgesendet wurden - speichereCloudEntwurf() prueft das und schreibt
// fuer eine solche Kombination NICHTS mehr, selbst wenn ein bereits
// laufender Cloud-Speicherversuch zeitlich noch "unterwegs" war, als
// "Schicht absenden" fertig wurde. Siehe Kommentar bei speichereCloudEntwurf().
let bereitsAbgesendeteKombinationen = new Set();

// Sequenzialisiert speichereCloudEntwurf()-Aufrufe: verhindert, dass ZWEI
// Aufrufe gleichzeitig "unterwegs" sind und sich dabei gegenseitig
// ueberholen koennen (der spaeter GESTARTETE, aber zufaellig frueher
// FERTIGE Aufruf mit veralteten Daten wuerde sonst den eigentlich
// aktuelleren Stand ueberschreiben). Ein bereits laufender Aufruf wird
// nicht abgebrochen, aber ein neuer Aufruf WARTET, bis der vorherige
// fertig ist, bevor er selbst die aktuellen Formulardaten einliest und
// schreibt - so gewinnt immer der zeitlich spaetere, tatsaechlich
// aktuellere Stand.
let cloudEntwurfKette = Promise.resolve();

document.getElementById('absendenBtn').addEventListener('click', async () => {
  // WICHTIG: als ALLERERSTES pruefen und sperren - verhindert, dass ein
  // zweiter, schneller Klick (Doppelklick oder ungeduldiges nochmaliges
  // Tippen, bevor die erste Anfrage fertig ist) den kompletten Handler
  // ein zweites Mal durchlaufen laesst. Ohne diese Sperre konnte es
  // passieren, dass die zweite Ausfuehrung mit bereits (durch die
  // erste, schneller abgeschlossene Anfrage) geleerten Feldern lief und
  // dadurch Nullwerte ueber die richtigen Werte geschrieben hat.
  if (sendeVorgangLaeuft) return;
  sendeVorgangLaeuft = true;
  document.getElementById('absendenBtn').disabled = true;

  if (!gewaehlteSchicht) {
    zeigeMeldung('fehler', '❌ Bitte zuerst Früh- oder Spätschicht auswählen.');
    sendeVorgangLaeuft = false;
    document.getElementById('absendenBtn').disabled = false;
    return;
  }

  const formular = sammleFormularDaten();
  const heuteIso = ausgewaehltesDatumIso();
  const heuteAnzeige = ausgewaehltesDatumAnzeige();

  // Stationen-Array im selben Format wie die Haupt-App erwartet
  // ("ausgewerteteDaten.stationen") zusammenbauen. Falls Form/Gr./Soll
  // vom Mitarbeiter geaendert wurden (weil sich ein Fehler in der
  // hinterlegten Vorlage eingeschlichen hatte), wird das als
  // "korrektur_*" mitgeschickt - genau wie am Haupt-PC bei einer
  // Korrektur eines KI-erkannten Zettels.
  const stationenFuerDatenbank = aktuellerStand.map(st => {
    const eingabe = formular.stationen.find(f => f.station === st.station) || {};
    const formGeaendert = (eingabe.form || '').trim() !== (st.form || '').trim();
    const groesseGeaendert = (eingabe.groesse || '').trim() !== String(st.groesse || '').trim();
    const sollGeaendert = (eingabe.soll || '').trim() !== String(st.soll || '').trim();
    return {
      station: st.station,
      ende: parseFloat(eingabe.ende) || 0,
      ausschuss: parseFloat(eingabe.ausschuss) || 0,
      neue_form: (eingabe.neueForm || '').trim(),
      neue_gr: (eingabe.neueGr || '').trim(),
      neues_soll: (eingabe.neuesSoll || '').trim(),
      neues_paar: parseFloat(eingabe.neuesPaar) || 0,
      neuer_ausschuss: parseFloat(eingabe.neuerAusschuss) || 0,
      kunde: (eingabe.kunde || '').trim(),
      korrektur_form: formGeaendert ? (eingabe.form || '').trim() : '',
      korrektur_gr: groesseGeaendert ? (eingabe.groesse || '').trim() : '',
      korrektur_soll: sollGeaendert ? (eingabe.soll || '').trim() : '',
      korrektur_anfang: String(st.anfang),
    };
  });

  // Zweiter Formwechsel (falls an einer Station mehrmals gewechselt
  // wurde) als eigenes Array - dasselbe Format wie am Haupt-PC.
  const zweiteFormwechselFuerDatenbank = [];
  aktuellerStand.forEach(st => {
    const eingabe = formular.stationen.find(f => f.station === st.station) || {};
    if ((eingabe.neueForm2 || '').trim()) {
      zweiteFormwechselFuerDatenbank.push({
        station: st.station,
        menge: parseFloat(eingabe.neuesPaar2) || 0,
        neue_form: (eingabe.neueForm2 || '').trim(),
        neue_gr: (eingabe.neueGr2 || '').trim(),
        neues_soll: (eingabe.neuesSoll2 || '').trim(),
        neuer_ausschuss: parseFloat(eingabe.neuerAusschuss2) || 0,
        kunde: (eingabe.kunde2 || '').trim(),
      });
    }
  });

  const absendenBtn = document.getElementById('absendenBtn');
  absendenBtn.disabled = true;
  absendenBtn.textContent = 'Wird gesendet...';

  try {
    const { error } = await supabaseClient
      .from('schichten')
      .upsert({
        rundlaeufer: RUNDLAEUFER_NUMMER,
        datum: heuteIso,
        schicht: gewaehlteSchicht,
        maschinenfuehrer: formular.maschinenfuehrer,
        reinklopfer: formular.reinklopfer,
        rausnehmer: formular.rausnehmer,
        stoerungsvermerk: formular.stoerung,
        stationen: stationenFuerDatenbank,
        status: 'offen',
        quelle: 'tablet',
        aktualisiert_am: new Date().toISOString(),
      }, { onConflict: 'rundlaeufer,datum,schicht' });

    if (error) throw error;

    const gesendeteSchichtId = (await supabaseClient
      .from('schichten')
      .select('id')
      .eq('rundlaeufer', RUNDLAEUFER_NUMMER)
      .eq('datum', heuteIso)
      .eq('schicht', gewaehlteSchicht)
      .maybeSingle()).data?.id;

    // Kompletten, gerade gesendeten Formularstand sichern, damit
    // "Rückgängig" ihn 1:1 wiederherstellen kann - inklusive der
    // urspruenglichen Formular-Werte (nicht nur die an die Datenbank
    // geschickte, leicht andere Struktur).
    letzterGesendeterStand = { formular, schicht: gewaehlteSchicht, schichtId: gesendeteSchichtId };

    // Prueft, ob durch die gerade gesendeten Formwechsel ein offener
    // Auftrag ("als naechstes einbauen") erledigt wurde.
    await pruefeAuftraegeErledigt(stationenFuerDatenbank);

    // KRITISCH: einen noch ausstehenden Cloud-Autosave-Timeout stoppen,
    // BEVOR die Felder unten geleert werden. Sonst konnte es passieren,
    // dass speichereCloudEntwurf() kurz NACH dem erfolgreichen Absenden
    // noch feuert (der Timeout lief bereits, bevor "Absenden" geklickt
    // wurde) und dabei die gerade final gesendete status='offen'-Zeile
    // mit status='entwurf' UND den (jetzt schon geleerten!) Nullwerten
    // überschreibt - obwohl "erfolgreich gesendet" korrekt angezeigt
    // wurde. Das war die Ursache dafuer, dass am Haupt-PC scheinbar
    // nichts ankam, obwohl das Tablet einen Erfolg meldete. Zusaetzlich
    // wird die Kombination sofort im Set vermerkt, damit auch ein
    // BEREITS LAUFENDER speichereCloudEntwurf()-Aufruf (dessen
    // Datenbank-Abfrage parallel unterwegs war) sich beim naechsten
    // Check selbst stoppt.
    clearTimeout(cloudAutosaveTimeout);
    bereitsAbgesendeteKombinationen.add(`${gewaehlteSchicht}|${heuteIso}`);
    // Der Eintrag soll nur KURZZEITIG verhindern, dass ein bereits
    // laufender, veralteter Cloud-Speicherversuch (der schon "unterwegs"
    // war, als "Absenden" geklickt wurde) die frisch gesendete Zeile
    // ueberschreibt. Er wird daher nach kurzer Zeit wieder entfernt -
    // sonst wuerde jegliches SPAETERES Weiterarbeiten an derselben
    // Schicht/demselben Datum (z.B. testweise Werte fuer die naechste
    // Schicht eintragen, oder eine Korrektur nach dem Absenden) dauerhaft
    // von der Cloud-Sicherung ausgeschlossen bleiben.
    setTimeout(() => {
      bereitsAbgesendeteKombinationen.delete(`${gewaehlteSchicht}|${heuteIso}`);
    }, 5000);

    loescheAutosave();
    zeigeMeldung('erfolg', `✅ Schicht (${gewaehlteSchicht}, ${heuteAnzeige}) erfolgreich gesendet! Die Auswertung erfolgt am Haupt-PC.`);
    document.getElementById('autosaveHinweisBtn').style.display = 'none';
    zeigeRueckgaengigButton();

    // Formular fuer die naechste Erfassung leeren - INKLUSIVE der
    // Team-Felder (Maschinenfuehrer, Reinklopfer, Rausnehmer), da sich
    // das Team von Schicht zu Schicht aendert und ein stehen gebliebener
    // alter Name sonst leicht versehentlich fuer die naechste Schicht
    // mit uebernommen wird.
    document.getElementById('maschinenfuehrerFeld').value = '';
    document.getElementById('reinklopferFeld').value = '';
    document.getElementById('rausnehmerFeld').value = '';
    document.getElementById('stoerungFeld').value = '';
    aktuellerStand.forEach(st => {
      const haekchenFeld = document.getElementById(`haekchen_${st.station}`);
      if (haekchenFeld) haekchenFeld.checked = false;
      ['ende','ausschuss','neueForm','neueGr','neuesSoll','neuesPaar','neuerAusschuss','kunde','neueForm2','neueGr2','neuesSoll2','neuesPaar2','neuerAusschuss2','kunde2'].forEach(feld => {
        const id = { ende:'ende_', ausschuss:'ausschuss_', neueForm:'neueForm_', neueGr:'neueGr_', neuesSoll:'neuesSoll_', neuesPaar:'neuesPaar_', neuerAusschuss:'neuerAusschuss_', kunde:'kunde_', neueForm2:'neueForm2_', neueGr2:'neueGr2_', neuesSoll2:'neuesSoll2_', neuesPaar2:'neuesPaar2_', neuerAusschuss2:'neuerAusschuss2_', kunde2:'kunde2_' }[feld] + st.station;
        const el = document.getElementById(id);
        if (el) el.value = '';
      });
      document.getElementById(`stationZeile${st.station}`)?.classList.remove('formwechsel-aktiv');
      document.getElementById(`neueForm_${st.station}`)?.classList.remove('kundenauftrag');
      document.getElementById(`neueForm2_${st.station}`)?.classList.remove('kundenauftrag');
    });
    aktualisiereGesamtKaestchen();
  } catch (fehler) {
    console.error('Schicht konnte nicht gesendet werden:', fehler);
    zeigeMeldung('fehler', '❌ Senden fehlgeschlagen: ' + fehler.message + ' - der eingegebene Stand bleibt auf diesem Tablet gespeichert, bitte erneut versuchen.');
  } finally {
    sendeVorgangLaeuft = false;
    absendenBtn.disabled = false;
    absendenBtn.textContent = '✅ Schicht absenden';
  }
});

document.getElementById('autosaveHinweisBtn').addEventListener('click', () => {
  document.getElementById('autosaveHinweisBtn').style.display = 'none';
});

// ------------------------------------------------------------------
// Live-Benachrichtigung: sobald der Haupt-PC eine neue Vorlage
// (aktualisierte Anfang-Werte) fuer DIESEN Rundlaeufer speichert,
// erscheint ein Pop-up. Ueberwacht per Supabase Realtime nur
// UPDATE/INSERT-Ereignisse WAEHREND dieser Sitzung - ein einfaches
// Neuladen der Seite loest das Pop-up nicht aus, nur eine tatsaechliche
// Aenderung, waehrend die Seite bereits offen ist.
const vorlagenKanal = supabaseClient
  .channel(`vorlage-rl${RUNDLAEUFER_NUMMER}`)
  .on(
    'postgres_changes',
    { event: '*', schema: 'public', table: 'vorlagen_dateien', filter: `rundlaeufer=eq.${RUNDLAEUFER_NUMMER}` },
    () => {
      document.getElementById('neuerPlanOverlay').classList.remove('versteckt');
    }
  )
  .subscribe();

document.getElementById('neuerPlanUebernehmenBtn').addEventListener('click', async () => {
  // Dieselbe garantierte Sofort-Speicherung wie beim manuellen
  // "Aktualisieren"-Button im Header - siehe Kommentar dort.
  clearTimeout(autosaveTimeout);
  clearTimeout(cloudAutosaveTimeout);
  speichereAutosaveSofort();
  await speichereCloudEntwurf();
  window.location.reload();
});

// Manueller "Aktualisieren"-Button im Header - jederzeit sichtbar, damit
// der Mitarbeiter auch OHNE das automatische Pop-up (z.B. falls es aus
// irgendeinem Grund nicht ausgeloest wurde) selbst aktiv nach dem
// neuesten Belegungsplan fragen kann. Warnt vorher, falls bereits echte
// Eingaben im Formular stehen, die durch das Neuladen kurz verschwinden
// wuerden (sie werden zwar durch die Autosave-Sicherung automatisch
// wiederhergestellt, aber ein kurzer Hinweis schafft Sicherheit).
document.getElementById('manuellAktualisierenBtn').addEventListener('click', async () => {
  // WICHTIG: vor dem Neuladen wird SOFORT und GARANTIERT gespeichert -
  // nicht die normalen, leicht verzoegerten Autosave-Timer (50ms lokal,
  // 300ms Cloud) abwarten, da in diesem kurzen Zeitfenster theoretisch
  // eine gerade eingetippte Eingabe noch nicht gesichert sein koennte.
  // Stattdessen wird hier explizit UND SYNCHRON (mit await) gespeichert,
  // bevor "reload()" ueberhaupt aufgerufen wird - danach ist der Stand
  // garantiert in localStorage UND in der Cloud gesichert.
  const formularVorSpeichern = sammleFormularDaten();
  const anzahlAusgefuellterStationenVorher = (formularVorSpeichern.stationen || []).filter(st => st.ende || st.ausschuss || st.neueForm).length;
  diagnose(`Aktualisieren-Klick: Schicht=${gewaehlteSchicht}, Datum=${document.getElementById('datumFeld').value}, ausgefuellte Stationen VOR Speichern=${anzahlAusgefuellterStationenVorher}`);

  clearTimeout(autosaveTimeout);
  clearTimeout(cloudAutosaveTimeout);
  speichereAutosaveSofort();
  const btn = document.getElementById('manuellAktualisierenBtn');
  btn.disabled = true;
  btn.textContent = '⏳ Speichere...';

  if (!gewaehlteSchicht) {
    diagnose('WARNUNG: KEINE Schicht ausgewaehlt - Speichern wuerde NICHTS tun!');
  }

  await speichereCloudEntwurf();
  diagnose('Speichern abgeschlossen, laedt Seite jetzt neu.');
  window.location.reload();
});

// Live-Benachrichtigung fuer NEUE Auftraege vom Abteilungsleiter - nur
// bei INSERT (neuer Auftrag), nicht bei jeder Statusaenderung (z.B.
// automatisches Erledigen durch pruefeAuftraegeErledigt), damit das
// Pop-up nicht unnoetig oft erscheint.
const auftraegeKanal = supabaseClient
  .channel(`auftraege-rl${RUNDLAEUFER_NUMMER}`)
  .on(
    'postgres_changes',
    { event: 'INSERT', schema: 'public', table: 'auftraege', filter: `rundlaeufer=eq.${RUNDLAEUFER_NUMMER}` },
    () => {
      document.getElementById('neuerAuftragOverlay').classList.remove('versteckt');
      ladeAuftraege();
    }
  )
  .subscribe();

document.getElementById('neuerAuftragAnsehenBtn').addEventListener('click', () => {
  document.getElementById('neuerAuftragOverlay').classList.add('versteckt');
  document.getElementById('auftraegeKarte')?.scrollIntoView({ behavior: 'smooth' });
});

// Start
ladeAktuellenStand();
ladeVorherigeSchichtKaestchen();
ladeAuftraege();
</script>
