<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Belegungsplan – Rundläufer</title>

<!-- PWA: macht die Seite auf dem Tablet-Startbildschirm installierbar -
     eigenes Icon, Vollbild-Ansicht ohne Browser-Adressleiste, verhaelt
     sich wie eine "echte" App, ohne dass ein App-Store-Konto/Freigabe-
     Prozess noetig ist. -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1c7c3f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Belegungsplan">
<link rel="apple-touch-icon" href="icon-v3-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-v3-192.png">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<style>
  :root {
    --gruen: #1c7c3f;
    --gruen-hell: #e6f4ea;
    --gelb-hell: #3f6fd8;
    --rot: #c0392b;
    --rot-hell: #fbe9e7;
    --text: #1f2430;
    --text-dim: #6b7280;
    --grau-rand: #d8dce3;
    --blau: #1a56db;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: #f4f6f9;
    color: var(--text);
    font-size: 14px;
    -webkit-tap-highlight-color: transparent;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }
  header {
    background: white;
    padding: 8px 14px;
    border-bottom: 1px solid var(--grau-rand);
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  header h1 { font-size: 16px; margin: 0; }
  header .status-punkt {
    width: 10px; height: 10px; border-radius: 50%;
    background: #ccc; display: inline-block; margin-right: 6px;
  }
  header .status-punkt.online { background: var(--gruen); }
  header .status-punkt.offline { background: var(--rot); }

  .container {
    max-width: 100%;
    margin: 0 auto;
    padding: 8px 10px;
    display: flex;
    flex-direction: column;
    flex: 1;
    min-height: 0; /* wichtig, damit der Flex-Container tatsaechlich schrumpfen und die Tabelle den Rest einnehmen kann */
  }

  .karte {
    background: white;
    border-radius: 10px;
    padding: 8px 10px;
    margin-bottom: 6px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    flex-shrink: 0;
  }

  .schicht-wahl { display: flex; gap: 8px; }
  .schicht-btn {
    flex: 1;
    padding: 8px;
    font-size: 14px;
    font-weight: 700;
    border-radius: 8px;
    border: 2px solid var(--grau-rand);
    background: white;
    color: var(--text);
    cursor: pointer;
  }
  .schicht-btn.aktiv { border-color: var(--gruen); background: var(--gruen-hell); color: var(--gruen); }

  label { display: block; font-weight: 600; margin-bottom: 3px; font-size: 12px; color: var(--text-dim); }
  input[type=text], input[type=number], textarea, select {
    width: 100%;
    padding: 8px;
    font-size: 14px;
    border-radius: 7px;
    border: 1.5px solid var(--grau-rand);
    margin-bottom: 6px;
    font-family: inherit;
  }
  input:focus, textarea:focus, select:focus { outline: none; border-color: var(--blau); }

  .team-grid { display: grid; grid-template-columns: 1fr; gap: 0; }
  @media (min-width: 700px) { .team-grid { grid-template-columns: 1fr 1fr 1fr; gap: 10px; } }

  /* Tabellen-Ansicht der 20 Stationen - angelehnt an den Original-
     Belegungsplan: Station, Form, Gr., Soll, Anfang, Ende, Auss. links,
     dann Form, Gr., Soll, Paar, Auss. rechts fuer den Formwechsel.
     Nimmt bewusst den GESAMTEN verbleibenden Platz ein (flex: 1), damit
     alle 20 Stationen moeglichst ohne Scrollen sichtbar sind, aehnlich
     der kompakten Uebersicht eines gedruckten A4-Belegungsplans. */
  .tabellen-wrapper {
    overflow-x: auto;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    border: 1px solid var(--grau-rand);
    border-radius: 8px;
    background: white;
    flex: 1;
    min-height: 0;
  }
  table.stationen-tabelle {
    border-collapse: collapse;
    width: 100%;
    height: 100%;
    min-width: 1500px;
    font-size: 12px;
  }
  table.stationen-tabelle th, table.stationen-tabelle td {
    border: 1px solid var(--grau-rand);
    padding: 2px 3px;
    text-align: center;
    white-space: nowrap;
  }
  table.stationen-tabelle th {
    background: #f4f6f9;
    font-size: 10.5px;
    color: var(--text-dim);
    font-weight: 700;
    position: sticky;
    top: 0;
    z-index: 4;
  }
  table.stationen-tabelle td.spalte-form-info { text-align: left; font-size: 12px; color: var(--text-dim); min-width: 130px; }
  table.stationen-tabelle td.spalte-anfang { font-weight: 700; background: #f8f9fb; font-size: 12px; }

  /* Haekchen-Spalte (ganz links) UND Station-Spalte (zweite von links)
     bleiben beim horizontalen Scrollen sichtbar - "left" ist auf die
     jeweils vorherigen fixierten Spalten abgestimmt, damit sie sich
     nicht ueberlappen. */
  table.stationen-tabelle td.spalte-haekchen, table.stationen-tabelle th:first-child {
    position: sticky;
    left: 0;
    z-index: 2;
    background: white;
  }
  table.stationen-tabelle th:nth-child(2), table.stationen-tabelle td:nth-child(2) {
    position: sticky;
    left: 28px;
    z-index: 1;
    background: white;
    font-weight: 800;
    font-size: 12px;
  }
  table.stationen-tabelle th:first-child, table.stationen-tabelle th:nth-child(2) { z-index: 5; background: #f4f6f9; }
  table.stationen-tabelle tr.formwechsel-aktiv td.spalte-haekchen,
  table.stationen-tabelle tr.formwechsel-aktiv td:nth-child(2) { background: var(--gelb-hell); }

  table.stationen-tabelle td.spalte-haekchen { text-align: center; width: 28px; }
  .haekchen-checkbox {
    width: 18px;
    height: 18px;
    cursor: pointer;
    accent-color: var(--gruen);
  }

  table.stationen-tabelle tr.formwechsel-aktiv td { background: var(--gelb-hell); }

  table.stationen-tabelle input {
    width: 42px;
    padding: 3px 2px;
    font-size: 12px;
    border-radius: 4px;
    border: 1px solid var(--grau-rand);
    text-align: center;
    margin-bottom: 0;
  }
  table.stationen-tabelle input.eingabe-breit { width: 70px; }
  /* Formnummern-Felder (alte Form + neue Form bei beiden Formwechseln)
     brauchen deutlich mehr Platz, um lange Artikelnummern inkl.
     Kundenname vollstaendig lesbar zu machen, ohne staendig scrollen zu
     muessen. */
  table.stationen-tabelle input.eingabe-form { width: 130px; text-align: left; padding-left: 5px; }
  table.stationen-tabelle input:focus { border-color: var(--blau); outline: none; }

  /* Kundenauftrag: das "Neue Form"-Feld wird blau hervorgehoben, sobald
     im zugehoerigen "Kunde"-Feld ein Name eingetragen ist - entspricht
     der blauen Kennzeichnung, die dieselbe Form/Kunde-Kombination auch
     in der Excel-Datei/im PDF-Belegungsplan am Haupt-PC bekommt. */
  table.stationen-tabelle input.eingabe-form.kundenauftrag {
    background: #e8f0ff;
    color: #0000FF;
    font-weight: 700;
    border-color: #1a56db;
  }

  .formwechsel-trenner td { background: #eef0f4; border-left: 3px solid var(--text-dim); }

  .formwechsel-toggle-zelle button {
    background: none;
    border: 1.5px solid var(--grau-rand);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 13px;
    color: var(--blau);
    cursor: pointer;
    white-space: nowrap;
  }
  tr.formwechsel-aktiv .formwechsel-toggle-zelle button { border-color: #1a56db; color: #12409e; }

  .hinweis-scroll { font-size: 11px; color: var(--text-dim); padding: 0; text-align: left; }

  .grosser-btn {
    width: 100%;
    padding: 12px;
    font-size: 15px;
    font-weight: 700;
    border-radius: 9px;
    border: none;
    background: var(--gruen);
    color: white;
    cursor: pointer;
    margin-top: 6px;
  }
  .grosser-btn:disabled { background: #a8b0bb; }
  .grosser-btn.sekundaer { background: white; color: var(--text); border: 2px solid var(--grau-rand); }

  .meldung {
    padding: 16px;
    border-radius: 10px;
    font-weight: 600;
    margin-bottom: 16px;
    display: none;
  }
  .meldung.erfolg { display: block; background: var(--gruen-hell); color: var(--gruen); }
  .meldung.fehler { display: block; background: var(--rot-hell); color: var(--rot); }
  .meldung.info { display: block; background: #eef2ff; color: var(--blau); }

  .versteckt { display: none !important; }

  datalist {}
  .popup-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 20px;
  }
  .popup-box {
    background: white;
    border-radius: 12px;
    padding: 16px;
    box-shadow: 0 8px 28px rgba(0,0,0,0.3);
    display: flex;
    align-items: flex-start;
    gap: 10px;
    max-width: 320px;
  }

  /* Eigenes Vorschlags-Dropdown fuer Artikelnummern (ersetzt <datalist>,
     die bei mehreren tausend Eintraegen im Browser unbrauchbar langsam
     wird). Wird per JavaScript positioniert und befuellt. */
  .artikel-dropdown {
    position: fixed;
    background: white;
    border: 1.5px solid var(--grau-rand);
    border-radius: 10px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.18);
    max-height: 280px;
    overflow-y: auto;
    z-index: 500;
    min-width: 260px;
  }
  .artikel-dropdown .eintrag {
    padding: 12px 14px;
    font-size: 16px;
    cursor: pointer;
    border-bottom: 1px solid #f0f1f4;
  }
  .artikel-dropdown .eintrag:last-child { border-bottom: none; }
  .artikel-dropdown .eintrag:hover, .artikel-dropdown .eintrag.markiert { background: #eef4fa; }
</style>
</head>
<body>

<!-- Pop-up: erscheint, sobald der Haupt-PC einen neuen Belegungsplan
     (aktualisierte Vorlage) fuer diesen Rundlaeufer gespeichert hat. -->
<div id="neuerPlanOverlay" class="popup-overlay versteckt">
  <div class="popup-box">
    <div style="font-size:24px;">📋</div>
    <div>
      <div style="font-weight:800; font-size:14px; margin-bottom:4px;">Neuer Belegungsplan verfügbar</div>
      <div style="color:var(--text-dim); font-size:12px; margin-bottom:8px;">Die Anfang-Werte für die nächste Schicht wurden aktualisiert.</div>
      <button type="button" class="grosser-btn" id="neuerPlanUebernehmenBtn" style="margin-top:0; padding:8px;">🔄 Jetzt aktualisieren</button>
    </div>
  </div>
</div>

<div id="neuerAuftragOverlay" class="popup-overlay versteckt">
  <div class="popup-box">
    <div style="font-size:24px;">📬</div>
    <div>
      <div style="font-weight:800; font-size:14px; margin-bottom:4px;">Neuer Auftrag vom Abteilungsleiter</div>
      <div style="color:var(--text-dim); font-size:12px; margin-bottom:8px;">Es gibt eine neue Anweisung für diesen Rundläufer.</div>
      <button type="button" class="grosser-btn" id="neuerAuftragAnsehenBtn" style="margin-top:0; padding:8px;">📋 Ansehen</button>
    </div>
  </div>
</div>

<header>
  <h1 id="titelText">Rundläufer –</h1>
  <div style="display:flex; align-items:center; gap:10px;">
    <span style="font-size:10px; color:var(--rot); font-weight:700;">v2026-08-06-14:15</span>
    <button type="button" id="manuellAktualisierenBtn" style="padding:5px 10px; font-size:11px; font-weight:700; border-radius:7px; border:1.5px solid var(--grau-rand); background:white; color:var(--blau); cursor:pointer;">🔄 Aktualisieren</button>
    <div><span class="status-punkt" id="statusPunkt"></span><span id="statusText" style="font-size:12px; color:var(--text-dim);">Verbinde...</span></div>
  </div>
</header>

<div class="container">

  <div class="meldung" id="meldungBox" style="padding:6px 10px; font-size:12px; margin-bottom:4px;"></div>

  <!-- Kompakter Kopfbereich: Datum, Schicht, Team und Störung in EINER
       Zeile statt mehrerer grosser Karten - maximiert den Platz fuer
       die Stationstabelle darunter. -->
  <div class="karte" style="padding:6px 10px;">
    <div style="display:flex; gap:8px; align-items:flex-end; flex-wrap:wrap;">
      <div style="flex:0 0 auto;">
        <label style="margin-bottom:2px;">Datum</label>
        <input type="date" id="datumFeld" style="margin-bottom:0; width:auto;">
      </div>
      <div style="flex:0 0 auto; display:flex; gap:4px;">
        <button type="button" class="schicht-btn" id="schichtFruehBtn" style="padding:6px 10px; font-size:12px;">☀️ Früh</button>
        <button type="button" class="schicht-btn" id="schichtSpaetBtn" style="padding:6px 10px; font-size:12px;">🌙 Spät</button>
      </div>
      <div style="flex:1; min-width:110px;">
        <label style="margin-bottom:2px;">Maschinenführer</label>
        <input type="text" id="maschinenfuehrerFeld" list="mitarbeiterListe" placeholder="Name/Nr." style="margin-bottom:0;">
      </div>
      <div style="flex:1; min-width:110px;">
        <label style="margin-bottom:2px;">Reinklopfer</label>
        <input type="text" id="reinklopferFeld" list="mitarbeiterListe" placeholder="Name/Nr." style="margin-bottom:0;">
      </div>
      <div style="flex:1; min-width:110px;">
        <label style="margin-bottom:2px;">Rausnehmer</label>
        <input type="text" id="rausnehmerFeld" list="mitarbeiterListe" placeholder="Name/Nr." style="margin-bottom:0;">
      </div>
      <div style="flex:2; min-width:150px;">
        <label style="margin-bottom:2px;">Wartung/Störung</label>
        <input type="text" id="stoerungFeld" placeholder="falls vermerkt" style="margin-bottom:0;">
      </div>
      <div id="vorherigeSchichtKarte" class="versteckt" style="flex:0 0 auto; background:#eef2ff; border-radius:7px; padding:4px 8px; text-align:center;">
        <div style="font-size:10px; color:var(--text-dim);">Letzte Schicht (<span id="vorherigeSchichtLabel"></span>)</div>
        <div id="vorherigeSchichtWert" style="font-size:16px; font-weight:800; color:var(--blau);">–</div>
      </div>
    </div>
    <datalist id="mitarbeiterListe"></datalist>
    <!-- Artikelnummern-Vorschlaege werden NICHT als <datalist> geladen (bei
         mehreren tausend Eintraegen wird das im Browser unbrauchbar
         langsam) - stattdessen ein eigenes, performantes Dropdown, das
         erst ab 2 Zeichen filtert (siehe JavaScript weiter unten). -->
    <div id="artikelVorschlaege" class="artikel-dropdown versteckt"></div>
  </div>

  <!-- Offene Auftraege vom Abteilungsleiter ("als naechstes einbauen") -
       sortiert nach Prioritaet. Verschwindet automatisch, sobald exakt
       diese Form+Groesse als Formwechsel eingetragen und abgesendet
       wird (siehe pruefeAuftraegeErledigt() weiter unten). Sehr schmal
       gehalten, um moeglichst wenig Platz von der Tabelle zu nehmen. -->
  <div class="karte versteckt" id="auftraegeKarte" style="background:#fff8e6; border:1.5px solid #f0c95e; padding:5px 10px; max-height:70px; overflow-y:auto;">
    <div style="font-weight:800; font-size:12px;">📋 Als nächstes einbauen</div>
    <div id="auftraegeListe" style="font-size:11px;"></div>
  </div>

  <!-- Stationen - nimmt den gesamten verbleibenden Platz ein (flex),
       damit moeglichst alle 20 Stationen ohne Scrollen sichtbar sind.
       "overflow:hidden" hier ist WICHTIG: verhindert, dass die Tabelle
       (die durch viele Spalten/Zeilen von Natur aus gross werden will)
       ueber ihren zugewiesenen Platz hinauswaechst. Zusaetzlich
       padding-bottom, damit die letzte Stationszeile nicht hinter dem
       jetzt komplett unabhaengig FIXIERTEN Button-Bereich verschwindet
       (siehe unten). -->
  <div id="stationenBereich" style="display:flex; flex-direction:column; flex:1; min-height:0; overflow:hidden; padding-bottom:56px;"></div>

</div>

<!-- WICHTIG: "position:fixed" statt "sticky" und AUSSERHALB von
     .container platziert - macht diesen Bereich komplett unabhaengig
     von der Flexbox-Verteilung/Groesse des Tabelleninhalts. Egal wie
     hoch die Stationstabelle durch viele ausgefuellte Formwechsel wird
     (z.B. nach einem Autosave-Wiederherstellen oder "Jetzt
     aktualisieren"), dieser Bereich bleibt garantiert am unteren
     Bildschirmrand sichtbar. -->
<div style="position:fixed; left:0; right:0; bottom:0; z-index:100; background:white; border-top:1px solid var(--grau-rand); padding:8px 10px; display:flex; gap:8px;">
  <button type="button" class="grosser-btn" id="absendenBtn" style="margin-top:0; padding:10px; flex-shrink:0;">✅ Schicht absenden</button>
  <button type="button" class="grosser-btn sekundaer" id="rueckgaengigBtn" style="display:none; margin-top:0; padding:10px; flex-shrink:0;">↩️ Zuletzt gesendete Schicht rückgängig machen</button>
  <button type="button" class="grosser-btn sekundaer" id="autosaveHinweisBtn" style="display:none; margin-top:0; padding:10px; flex-shrink:0;">↩️ Zwischenstand wiederhergestellt</button>
</div>

<script>
// ------------------------------------------------------------------
// Supabase-Verbindung - dieselbe zentrale Datenbank wie die Haupt-App.
// ------------------------------------------------------------------
const SUPABASE_URL = 'https://otmsgyihmrvkwgtgjoui.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im90bXNneWlobXJ2a3dndGdqb3VpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ1NTAxNzYsImV4cCI6MjEwMDEyNjE3Nn0.ixywkFFKk-eTfrBxQysE8nRFJFuloKHYH5IOmkIJfs8';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ------------------------------------------------------------------
// Rundlaeufer-Nummer wird FEST aus der URL gelesen (z.B.
// tablet.html?rl=4) - dieses Tablet zeigt IMMER nur dieses Formular,
// keine Auswahlmoeglichkeit fuer andere Rundlaeufer.
// ------------------------------------------------------------------
const urlParameter = new URLSearchParams(window.location.search);
const RUNDLAEUFER_NUMMER = parseInt(urlParameter.get('rl'), 10);

if (!RUNDLAEUFER_NUMMER || RUNDLAEUFER_NUMMER < 1) {
  document.body.innerHTML = '<div style="padding:20px; text-align:center; font-size:15px;">' +
    '⚠️ Keine gültige Rundläufer-Nummer in der Adresse gefunden.<br><br>' +
    'Bitte die Adresse mit "?rl=NUMMER" aufrufen, z.B.:<br>' +
    '<code>tablet.html?rl=4</code></div>';
  throw new Error('Keine Rundläufer-Nummer angegeben');
}

document.getElementById('titelText').textContent = `Rundläufer ${RUNDLAEUFER_NUMMER}`;
document.title = `Belegungsplan – Rundläufer ${RUNDLAEUFER_NUMMER}`;
console.log('[Diagnose] Rundläufer-Nummer erkannt:', RUNDLAEUFER_NUMMER);

const AUTOSAVE_SCHLUESSEL = `tablet_autosave_rl${RUNDLAEUFER_NUMMER}`;

function lokalesDatumIso(datum) {
  const d = datum || new Date();
  const jahr = d.getFullYear();
  const monat = String(d.getMonth() + 1).padStart(2, '0');
  const tag = String(d.getDate()).padStart(2, '0');
  return `${jahr}-${monat}-${tag}`;
}
function lokalesDatumAnzeige(datum) {
  const d = datum || new Date();
  const tag = String(d.getDate()).padStart(2, '0');
  const monat = String(d.getMonth() + 1).padStart(2, '0');
  const jahr = d.getFullYear();
  return `${tag}.${monat}.${jahr}`;
}

// Liest das im Datumsfeld tatsaechlich AUSGEWAEHLTE Datum (Format
// JJJJ-MM-TT, wie es <input type="date"> liefert) - das Feld steht
// standardmaessig auf heute, kann aber manuell geaendert werden, um
// eine verpasste/nachtraeglich einzutragende Schicht (z.B. Spaetschicht
// von gestern) korrekt zu erfassen. Ueberall, wo bisher "heute" fest
// angenommen wurde, wird ab jetzt dieses ausgewaehlte Datum verwendet.
function ausgewaehltesDatumIso() {
  const feldWert = document.getElementById('datumFeld').value;
  return feldWert || lokalesDatumIso();
}
function ausgewaehltesDatumAnzeige() {
  const iso = ausgewaehltesDatumIso();
  const [jahr, monat, tag] = iso.split('-');
  return `${tag}.${monat}.${jahr}`;
}

document.getElementById('datumFeld').value = lokalesDatumIso();

function zeigeMeldung(typ, text) {
  const el = document.getElementById('meldungBox');
  el.className = 'meldung ' + typ;
  el.textContent = text;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// Schreibt eine Diagnose-Zeile SOWOHL in die Browser-Konsole (fuer
// Entwickler mit F12-Tools) ALS AUCH sichtbar in einen kleinen Bereich
// direkt im Formular - damit ein Problem auch OHNE Entwicklertools
// direkt auf dem Tablet abgelesen und durchgegeben werden kann. Die
// neueste Zeile steht immer oben.
function diagnose(text) {
  console.log('[Diagnose] ' + text);
  const el = document.getElementById('diagnoseBereich');

let artikelDropdownAktivesFeld = null;

function zeigeArtikelVorschlaege(feld) {
  const suchtext = feld.value.trim().toLowerCase();
  const dropdown = document.getElementById('artikelVorschlaege');
  if (suchtext.length < 2) {
    dropdown.classList.add('versteckt');
    return;
  }

  const treffer = artikelnummernCache
    .filter(a => a.nummer.toLowerCase().includes(suchtext))
    .slice(0, 15);

  if (treffer.length === 0) {
    dropdown.classList.add('versteckt');
    return;
  }

  dropdown.innerHTML = treffer.map(a =>
    `<div class="eintrag" data-wert="${a.nummer.replace(/"/g, '&quot;')}">${a.nummer}${a.kunde ? ' <span style="color:var(--text-dim);">- ' + a.kunde + '</span>' : ''}</div>`
  ).join('');

  // Dropdown direkt unter dem aktiven Feld positionieren
  const rechteck = feld.getBoundingClientRect();
  dropdown.style.left = rechteck.left + 'px';
  dropdown.style.top = (rechteck.bottom + 4) + 'px';
  dropdown.style.width = Math.max(rechteck.width, 260) + 'px';

  dropdown.querySelectorAll('.eintrag').forEach(el => {
    el.addEventListener('mousedown', (e) => {
      e.preventDefault(); // verhindert, dass das Feld den Fokus VOR dem Klick verliert
      feld.value = el.dataset.wert;
      dropdown.classList.add('versteckt');

// ------------------------------------------------------------------
// Aktueller Stand (Form, Groesse, Soll, Anfang) fuer diesen Rundlaeufer
// aus der zuletzt gespeicherten Vorlage laden - die Vorlagen liegen als
// Excel-Base64 in Supabase (Tabelle "vorlagen_dateien"), genau wie in
// der Haupt-App. Fuer das Tablet werden daraus nur die 20 Zeilen
// (Form/Gr./Soll/Anfang) extrahiert.
// ------------------------------------------------------------------
let aktuellerStand = []; // [{station, form, groesse, soll, anfang}, ...]
let aktuelleVorlageZeitstempel = null; // "aktualisiert_am" der zuletzt geladenen Vorlage - siehe stelleAutosaveWiederHer()

function base64ZuArrayBuffer(base64) {
  const binaer = atob(base64);
  const bytes = new Uint8Array(binaer.length);
  for (let i = 0; i < binaer.length; i++) bytes[i] = binaer.charCodeAt(i);
  return bytes.buffer;
}

// Sucht die zuletzt ABGESCHLOSSENE Schicht dieses Rundlaeufers und zeigt
// deren Kaestchen-Zahl (produzierte Gesamtmenge) an - als Vergleichswert
// fuer den neuen Mitarbeiter ("was hat mein Vormann produziert").
// ------------------------------------------------------------------
// Offene Auftraege vom Abteilungsleiter ("als naechstes einbauen") -
// werden nach Prioritaet sortiert angezeigt. Ein Pop-up erscheint, wenn
// waehrend der laufenden Sitzung ein NEUER Auftrag eintrifft (siehe
// Realtime-Abo weiter unten).
async function ladeAuftraege() {
  const { data, error } = await supabaseClient
    .from('auftraege')
    .select('*')
    .eq('rundlaeufer', RUNDLAEUFER_NUMMER)
    .eq('status', 'offen')
    .order('prioritaet', { ascending: true });

  const karte = document.getElementById('auftraegeKarte');
  const liste = document.getElementById('auftraegeListe');

  if (error) {
    console.error('Aufträge konnten nicht geladen werden:', error);
    return;
  }
  if (!data || data.length === 0) {
    karte.classList.add('versteckt');
    return;
  }

  karte.classList.remove('versteckt');
  liste.innerHTML = data.map(a => {
    const details = a.pdf_dateiname
      ? `📄 ${a.pdf_dateiname}`
      : [a.form, a.groesse ? `Gr. ${a.groesse}` : '', a.soll ? `Soll ${a.soll}` : ''].filter(Boolean).join(' · ');
    return `<div style="padding:8px 0; border-bottom:1px solid #f0e2b8; display:flex; justify-content:space-between; align-items:center; gap:10px;">
      <div>
        <strong>Prio ${a.prioritaet}:</strong> ${details}
        ${a.bemerkung ? `<div style="font-size:14px; color:#7a5c00;">${a.bemerkung}</div>` : ''}
      </div>
      <button type="button" class="kleiner-btn auftrag-stornieren" data-id="${a.id}" style="flex-shrink:0; padding:8px 12px; font-size:13px; border-radius:8px; border:1.5px solid var(--grau-rand); background:white; cursor:pointer;">✕ Stornieren</button>
    </div>`;
  }).join('');

  liste.querySelectorAll('.auftrag-stornieren').forEach(btn => {
    btn.addEventListener('click', async () => {
      const bestaetigt = confirm('Diesen Auftrag wirklich stornieren? (z.B. weil die Form aktuell an einem anderen Rundläufer läuft)');
      if (!bestaetigt) return;
      btn.disabled = true;
      const { error: stornoFehler } = await supabaseClient
        .from('auftraege')
        .update({ status: 'storniert' })
        .eq('id', parseInt(btn.dataset.id, 10));
      if (stornoFehler) {
        console.error('Auftrag konnte nicht storniert werden:', stornoFehler);
        zeigeMeldung('fehler', '❌ Stornieren fehlgeschlagen: ' + stornoFehler.message);
        btn.disabled = false;
        return;
      }
      await ladeAuftraege();
      zeigeMeldung('info', 'ℹ️ Auftrag storniert.');
    });
  });
}

// Prueft nach dem Absenden einer Schicht, ob eine der eingetragenen
// Formwechsel-Formnummern (inkl. Groesse) zu einem offenen Auftrag
// passt - falls ja, wird der Auftrag automatisch als "erledigt"
// markiert. Vergleich erfolgt case-insensitive und ohne fuehrende/
// nachfolgende Leerzeichen, damit kleine Schreibunterschiede nicht
// stoeren.
async function pruefeAuftraegeErledigt(stationenFuerDatenbank) {
  const { data: offeneAuftraege } = await supabaseClient
    .from('auftraege')
    .select('id, form, groesse')
    .eq('rundlaeufer', RUNDLAEUFER_NUMMER)
    .eq('status', 'offen')
    .not('form', 'is', null);

  if (!offeneAuftraege || offeneAuftraege.length === 0) return;

  const normalisiere = (text) => (text || '').trim().toLowerCase();
  const eingetrageneFormwechsel = [];
  stationenFuerDatenbank.forEach(st => {
    if (st.neue_form) eingetrageneFormwechsel.push({ form: st.neue_form, groesse: st.neue_gr });
  });

  for (const auftrag of offeneAuftraege) {
    const treffer = eingetrageneFormwechsel.some(fw =>
      normalisiere(fw.form) === normalisiere(auftrag.form) &&
      (!auftrag.groesse || normalisiere(fw.groesse) === normalisiere(auftrag.groesse))
    );
    if (treffer) {
      await supabaseClient.from('auftraege').update({ status: 'erledigt', erledigt_am: new Date().toISOString() }).eq('id', auftrag.id);
    }
  }
  await ladeAuftraege();
}

async function ladeAktuellenStand(versuch = 1) {
  // WICHTIG: verhindert, dass zwei ladeAktuellenStand()-Durchlaeufe
  // gleichzeitig aktiv sind (z.B. wenn die Funktion durch einen
  // zweiten, ueberlappenden Aufruf erneut gestartet wird, waehrend ein
  // vorheriger Versuch - etwa nach einem Netzwerkfehler - noch laeuft).
  // Ohne diese Sperre konnte ein spaeter startender, aber schneller
  // fertig werdender zweiter Durchlauf die Tabelle NOCHMAL mit leeren
  // Feldern aufbauen und dabei einen bereits erfolgreich
  // wiederhergestellten (und eventuell schon weiter befuellten)
  // Zwischenstand ueberschreiben. Ein try/finally sorgt dafuer, dass
  // die Sperre an JEDEM Ausstiegspunkt (Erfolg, Fehler, mehrere
  // return-Stellen) garantiert wieder freigegeben wird.
  if (versuch === 1) {
    if (ladeVorgangAktiv) {
      console.log('[Diagnose] ladeAktuellenStand() uebersprungen - ein Durchlauf laeuft bereits.');
      return;
    }
    ladeVorgangAktiv = true;
  }

  try {
    await ladeAktuellenStandInnen(versuch);
  } finally {
    if (versuch === 1) ladeVorgangAktiv = false;
  }
}

async function ladeAktuellenStandInnen(versuch) {
  const MAX_VERSUCHE = 4;
  console.log(`[Diagnose] ladeAktuellenStand() gestartet für Rundläufer ${RUNDLAEUFER_NUMMER} (Versuch ${versuch}/${MAX_VERSUCHE})`);
  const bereich = document.getElementById('stationenBereich');
  bereich.innerHTML = `<div class="karte" style="text-align:center; padding:14px; font-size:13px;">⏳ Lade aktuellen Stand...</div>`;

  const { data, error } = await supabaseClient
    .from('vorlagen_dateien')
    .select('base64_inhalt, aktualisiert_am')
    .eq('rundlaeufer', RUNDLAEUFER_NUMMER)
    .maybeSingle();

  console.log('[Diagnose] Supabase-Antwort erhalten. error:', error, 'data vorhanden:', !!data, 'Länge base64:', data?.base64_inhalt?.length);

  // WICHTIG: ein Fehler hier ist bei kurzzeitig fehlender/instabiler
  // Verbindung erwartbar (z.B. WLAN kurz weg) - NICHT sofort mit einer
  // Fehlermeldung aufgeben, sonst wird baueStationenFormular() (und
  // damit die Autosave-Wiederherstellung mit bereits eingetragenen
  // Werten!) gar nicht erst erreicht, obwohl der lokale Zwischenstand
  // die ganze Zeit unversehrt vorhanden war. Stattdessen automatisch
  // mit kurzer, wachsender Pause erneut versuchen. WICHTIG: der naechste
  // Versuch wird DIREKT (nicht ueber die aeussere ladeAktuellenStand())
  // aufgerufen, damit die Sperre nicht zwischendurch freigegeben wird.
  if (error) {
    if (versuch < MAX_VERSUCHE) {
      bereich.innerHTML = `<div class="karte" style="text-align:center; padding:14px; font-size:13px;">⏳ Verbindung wird wiederhergestellt, versuche erneut...</div>`;
      await new Promise(resolve => setTimeout(resolve, versuch * 1500));
      return ladeAktuellenStandInnen(versuch + 1);
    }
    const hinweis = `❌ Die Vorlage konnte auch nach mehreren Versuchen nicht geladen werden - bitte WLAN-Verbindung prüfen und die Seite neu laden. Ein bereits eingetragener Zwischenstand bleibt auf diesem Gerät gespeichert und geht dabei nicht verloren.`;
    zeigeMeldung('fehler', hinweis);
    bereich.innerHTML = `<div class="karte" style="text-align:center; padding:14px; font-size:13px; color:var(--rot); font-weight:600;">${hinweis}</div>`;
    return;
  }

  if (!data) {
    const hinweis = `❌ Für Rundläufer ${RUNDLAEUFER_NUMMER} ist noch keine Vorlage in der Datenbank hinterlegt. Bitte am Haupt-PC in den Einstellungen eine Vorlage hochladen, dann diese Seite neu laden.`;
    zeigeMeldung('fehler', hinweis);
    bereich.innerHTML = `<div class="karte" style="text-align:center; padding:14px; font-size:13px; color:var(--rot); font-weight:600;">${hinweis}</div>`;
    return;
  }

  try {
    console.log('[Diagnose] Beginne Excel-Datei zu lesen...');
    aktuelleVorlageZeitstempel = data.aktualisiert_am;
    const buf = base64ZuArrayBuffer(data.base64_inhalt);
    console.log('[Diagnose] Base64 dekodiert, Bytes:', buf.byteLength);
    const wb = XLSX.read(buf, { type: 'array' });
    console.log('[Diagnose] Excel-Datei gelesen. Sheets:', wb.SheetNames);
    const ws = wb.Sheets[wb.SheetNames.includes('Berrechnen') ? 'Berrechnen' : wb.SheetNames[0]];
    const ERSTE_STATIONSZEILE = 6;
    aktuellerStand = [];
    for (let s = 1; s <= 20; s++) {
      const zeile = ERSTE_STATIONSZEILE + (s - 1);
      const lese = (spalte) => {
        const zelle = ws[spalte + zeile];
        return zelle ? zelle.v : '';
      };
      aktuellerStand.push({
        station: s,
        form: lese('B'),
        groesse: lese('C'),
        soll: lese('D'),
        anfang: parseFloat(lese('E')) || 0,
      });
    }
    console.log('[Diagnose] Stationen extrahiert:', aktuellerStand.length, aktuellerStand[0]);
    baueStationenFormular();
    console.log('[Diagnose] baueStationenFormular() abgeschlossen.');
  } catch (fehler) {
    console.error('[Diagnose] FEHLER beim Lesen der Vorlage:', fehler);
    const hinweis = '❌ Die hinterlegte Vorlage konnte nicht gelesen werden: ' + fehler.message + '. Bitte am Haupt-PC prüfen.';
    zeigeMeldung('fehler', hinweis);
    bereich.innerHTML = `<div class="karte" style="text-align:center; padding:14px; font-size:13px; color:var(--rot); font-weight:600;">${hinweis}</div>`;
  }
}
